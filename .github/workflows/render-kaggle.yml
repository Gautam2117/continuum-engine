name: Render on Kaggle GPU

# Cinematic renders (Blender Cycles on Kaggle's free GPU, about 30 hours a week) for specs with 3D shots.
# Needs the repository secret KAGGLE_KEY (or KAGGLE_API_TOKEN): Kaggle → Settings → API → Generate New Token.
# Works with both kinds of Kaggle key: the new API token and the older 32-character key from kaggle.json.
# The Kaggle username is not a secret; it defaults to continuumarc (override with a KAGGLE_USERNAME secret).
# The everyday path stays render.yml (CPU, fast clay look); use this for hero videos and long-form 3D.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Specs to render, space separated, e.g. specs/2026-11-15/atlas-s1.json"
        required: true
      samples:
        description: "Cycles samples per frame"
        default: "48"
      publish:
        description: "yes = attach to the date's release (Studio picks it up); no = test run, video kept as a workflow artifact"
        default: "yes"

permissions:
  contents: write

concurrency:
  group: render-kaggle
  cancel-in-progress: false

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KUSER: ${{ secrets.KAGGLE_USERNAME || 'continuumarc' }}
      KSECRET: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - name: Kaggle credentials
        run: |
          if [ -z "$KSECRET" ]; then echo "::error::Add the KAGGLE_KEY repository secret first."; exit 1; fi
          echo "::add-mask::$KSECRET"
          echo "KAGGLE_USERNAME=$KUSER" >> "$GITHUB_ENV"
          if echo "$KSECRET" | grep -Eq '^[0-9a-f]{32}$'; then
            # older key: kaggle.json style
            mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KUSER" "$KSECRET" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
            echo "KAGGLE_KEY=$KSECRET" >> "$GITHUB_ENV"
          else
            echo "KAGGLE_API_TOKEN=$KSECRET" >> "$GITHUB_ENV"
          fi
      - name: Who am I
        run: kaggle kernels list --mine --page-size 1 > /dev/null && echo "Kaggle auth OK as $KAGGLE_USERNAME"
      - name: Validate specs
        run: |
          pip install -q -r requirements.txt
          if [ "${{ github.event.inputs.publish }}" = "yes" ]; then
            python3 scripts/validate.py --strict ${{ github.event.inputs.specs }}
          else
            python3 scripts/validate.py ${{ github.event.inputs.specs }} || true
          fi
      - name: Push the job to Kaggle
        run: |
          mkdir -p job
          sed -e "s|__REPO_SHA__|${GITHUB_SHA}|" -e "s|__SPECS__|${{ github.event.inputs.specs }}|" kaggle/render/script.py > job/script.py
          sed -i "s|os.environ.get(\"B3D_SAMPLES\", \"48\")|\"${{ github.event.inputs.samples }}\"|" job/script.py
          cat > job/kernel-metadata.json <<META
          {"id": "${KAGGLE_USERNAME}/continuum-render", "title": "continuum-render", "code_file": "script.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true, "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          META
          kaggle kernels push -p job
      - name: Wait for Kaggle
        run: |
          for i in $(seq 1 340); do
            st="$(kaggle kernels status "${KAGGLE_USERNAME}/continuum-render" 2>&1 || true)"
            echo "$st"
            case "$st" in
              *complete*|*COMPLETE*) exit 0;;
              *error*|*ERROR*|*cancel*|*CANCEL*) kaggle kernels output "${KAGGLE_USERNAME}/continuum-render" -p dl || true; tail -50 dl/*.log 2>/dev/null; exit 1;;
            esac
            sleep 60
          done
          exit 1
      - name: Collect
        run: |
          kaggle kernels output "${KAGGLE_USERNAME}/continuum-render" -p dl
          find dl -maxdepth 3 | head -50
      - name: Publish
        if: github.event.inputs.publish == 'yes'
        run: for s in ${{ github.event.inputs.specs }}; do python3 scripts/publish.py "$s" dl/out; done
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-render
          path: |
            dl/out/**/video.mp4
            dl/*.log
          if-no-files-found: warn
