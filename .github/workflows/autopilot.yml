name: Autopilot

# The always-on brain. Runs four times a day on GitHub's servers, so it keeps going when nobody is online:
#  1. pull real analytics from Continuum Studio
#  2. write scripts for every channel that is short of videos (today + next 2 days = a 2-day buffer)
#  3. commit them, and start renders for anything new or stuck
# Rendered videos land in releases; Continuum Studio pulls them in and schedules each at its publish time.
# PAUSED (12 Nov 2026): the schedule is removed on purpose. Only Counterfactual Atlas is automated (3 uploads a day);
# every other channel is made on request. Add the cron lines back only after a checked quality batch.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days ahead to fill (today included)"
        default: "3"
      only:
        description: "Channel (exact name), several separated by |, or ALL for every channel"
        default: "Counterfactual Atlas"
        required: false

      preview:
        description: "Run planning and validate specs without committing or dispatching renders"
        type: boolean
        default: false

      render_from:
        description: "Render and verify artifacts from a completed preview run ID"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    if: inputs.render_from == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy num2words
      - name: Learn from real results
        run: python3 scripts/autopilot.py learn
      - name: Plan
        id: plan
        timeout-minutes: 40          # a long run must still commit what it wrote; the next run continues
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only || 'Counterfactual Atlas' }}
          DAYS: ${{ inputs.days || '3' }}
        run: |
          ARGS=()
          if [ "$ONLY" != "ALL" ]; then IFS='|' read -ra LIST <<< "$ONLY"; for c in "${LIST[@]}"; do ARGS+=(--only "$c"); done; fi
          python3 scripts/autopilot.py plan --days "$DAYS" "${ARGS[@]}"
      - name: Check the new specs
        id: validate
        if: ${{ !cancelled() && steps.plan.outcome != 'skipped' }}
        run: |
          NEW="$(git ls-files --others --exclude-standard specs | grep '\.json$' || true)"
          if [ -n "$NEW" ]; then python3 scripts/validate.py --strict $NEW; fi
      - name: Commit
        id: commit
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && !inputs.preview }}
        run: |
          git config user.name "continuum-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add specs autopilot/state
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Autopilot: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
      - name: Find specs that never rendered
        id: heal
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: python3 scripts/autopilot.py heal
      - name: Start renders
        if: ${{ !cancelled() && steps.heal.outcome == 'success' }}
        env:
          TODO: ${{ steps.plan.outputs.new }} ${{ steps.heal.outputs.heal }}
        run: |
          TODO="$(printf '%s\n' "$TODO" | xargs -n1 | sort -u | xargs)"
          if [ -n "$TODO" ]; then gh workflow run render.yml -f specs="$TODO"; echo "render started for: $TODO"; fi
      - name: Save preview evidence
        if: ${{ !cancelled() && inputs.preview && steps.plan.outcome != 'skipped' }}
        run: |
          mkdir -p preview
          if [ -f autopilot/state/heartbeat.json ]; then
            cp autopilot/state/heartbeat.json preview/
          fi
          git ls-files -z --others --exclude-standard specs |
            while IFS= read -r -d '' file; do cp --parents "$file" preview/; done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.preview && steps.plan.outcome != 'skipped' }}
        with:
          name: autopilot-preview
          path: preview/

  render-preview:
    if: inputs.render_from != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/render-preview.yml
    with:
      plan_run: ${{ inputs.render_from }}
