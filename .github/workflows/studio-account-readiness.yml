name: Studio account connection health

# Bounded software-operation monitoring. Not a content generation/render farm.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: studio-account-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Audit Studio 48-channel connections without exposing OAuth tokens
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTOPILOT_SECRET:-}" ]]; then
            echo '::error::No configured Studio diagnostics secret.'
            exit 2
          fi
          response="${RUNNER_TEMP}/readiness.json"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 30 --retry 1 \
            --header "Authorization: Bearer ${AUTOPILOT_SECRET}" \
            --header 'Accept: application/json' \
            'https://studio.continuumarc.tech/api/autopilot/readiness' \
            > "$response"
          python3 - "$response" <<'PY'
          import collections, json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          result=json.loads(p.read_text())
          if result.get('target')!=48 or len(result.get('channels') or [])!=48:
              raise SystemExit('Invalid 48-channel readiness result; cannot claim network coverage')
          linked=result['recentlySynced']
          attention=result['needsAttention']
          if not isinstance(linked,int) or not 0<=linked<=48 or attention!=48-linked:
              raise SystemExit('Inconsistent live connection counts')
          counters=collections.Counter(x.get('state','unknown') for x in result['channels'])
          atlas=[c for c in result['channels'] if c.get('slug')=='atlas' and c.get('name')=='Counterfactual Atlas']
          if len(atlas)!=1:
              raise SystemExit('Atlas account identity missing or ambiguous; fail closed')
          atlas_state=atlas[0].get('state','unknown')
          report=[
              '## Continuum Studio: actual connection evidence',
              f'Linked and recently synced: **{linked}/48**',
              f'Attention required: **{attention}/48**',
              f'Counterfactual Atlas exact account state: **{atlas_state}**',
              f'Duplicate explicit routing mappings: **{result.get("duplicateMappings",0)}**',
              f'Automatic publishing switch: **{bool(result.get("youtubePublisherEnabled"))}**',
              '', 'Readiness groups (not subscriber counts):',
              *[f'- {name}: {count}' for name,count in sorted(counters.items())],
              '', 'This checks configured account linkage only, not a verified upload or monetization.'
          ]
          content='\n'.join(report)+'\n'
          print(content)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as file:file.write(content)
          PY
      - name: Verify Atlas OAuth token against the actual Google-selected YouTube channel
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTOPILOT_SECRET:-}" ]]; then
            echo '::error::Atlas cannot verify OAuth without Studio diagnostic authorization'
            exit 2
          fi
          result="${RUNNER_TEMP}/atlas-oauth.json"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 30 --retry 1 \
            --header "Authorization: Bearer ${AUTOPILOT_SECRET}" \
            --header 'Accept: application/json' \
            'https://studio.continuumarc.tech/api/autopilot/atlas-preflight' > "$result"
          python3 - "$result" <<'PY'
          import json,os,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if d.get('ready') is not True or d.get('channel')!='Counterfactual Atlas' or d.get('identityMatch') is not True:
              raise SystemExit('Atlas OAuth identity mismatch; publishing stays disabled')
          channel_id=d.get('youtubeChannelId','')
          if not channel_id.startswith('UC') or len(channel_id)!=24:
              raise SystemExit('Invalid live Atlas YouTube channel ID')
          lines=[
              '## Atlas live Google OAuth preflight',
              '- Exact OAuth channel identity: **MATCHED**',
              '- Upload scope and synchronization: **verified by Studio**',
              '- Live channel video count: **'+str(d.get('currentPublicVideoCount','unknown'))+'**',
              '- Live subscribers: **'+str(d.get('subscribers','unknown'))+'**',
              '- 28-day stored views: **'+str(d.get('reportedViews28','unknown'))+'**',
              '- Atlas upload authorization: **NOT GRANTED by this test**',
              '- Global automated publisher: **'+str(bool(d.get('publicAutoPublisherEnabled')))+'**',
              '',
              'No credentials, token or email is shown. No video was uploaded.'
          ]
          output='\n'.join(lines)+'\n'
          print(output)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(output)
          PY
