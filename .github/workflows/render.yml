name: Render

# Every spec pushed under specs/ is rendered to an MP4 + thumbnail + upload pack and attached to a
# GitHub release named after its date folder. Continuum Studio pulls new releases into Upload packs.
on:
  push:
    branches: [main]
    paths: ["specs/**"]
  workflow_dispatch:
    inputs:
      specs:
        description: "Glob of specs to render, e.g. specs/2026-11-13/*.json (blank = specs changed by the last push)"
        required: false

permissions:
  contents: write

concurrency:
  group: render-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: python3 scripts/plan.py "${{ github.event.inputs.specs }}" "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.specs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        spec: ${{ fromJson(needs.plan.outputs.specs) }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-crosextra-caladea fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji libfribidi0 libharfbuzz0b libraqm0 > /dev/null
      # Blender (bpy, Python 3.13) only when this spec has 3D shots; the engine itself stays on 3.12.
      - name: Does this spec use 3D?
        id: b3d
        run: if grep -q '"b3d"' "${{ matrix.spec }}"; then echo "need=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.b3d.outputs.need == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.b3d.outputs.need == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: bpy-5.3.0
      - name: Blender
        if: steps.b3d.outputs.need == '1'
        run: |
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3 > /dev/null
          python3.13 -m venv ~/bvenv && ~/bvenv/bin/pip install -q bpy==5.3.0
          echo "B3D_PYTHON=$HOME/bvenv/bin/python" >> "$GITHUB_ENV"
          echo "B3D_ENGINE=WORKBENCH" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      # Persona videos (Sienna, Aditi, Kiara) use stills from a PRIVATE Kaggle dataset; the images never enter this public repo.
      - name: Persona stills
        if: ${{ hashFiles(matrix.spec) != '' }}
        env:
          KUSER: ${{ secrets.KAGGLE_USERNAME || 'continuumarc' }}
          KSECRET: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_KEY }}
        run: |
          if grep -q '"type": *"persona"' "${{ matrix.spec }}"; then
            if [ -z "$KSECRET" ]; then echo "::warning::No Kaggle key; persona scenes fall back to text."; exit 0; fi
            echo "::add-mask::$KSECRET"
            pip install -q kaggle six
            export KAGGLE_USERNAME="$KUSER"
            if echo "$KSECRET" | grep -Eq '^[0-9a-f]{32}$'; then
              mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KUSER" "$KSECRET" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
            else
              export KAGGLE_API_TOKEN="$KSECRET"
            fi
            mkdir -p .cache/personas
            kaggle datasets download "$KUSER/continuum-personas" -p .cache/personas --unzip -q || echo "::warning::persona dataset download failed"
            find .cache/personas -type f -name '*.jp*g' -exec mv -n {} .cache/personas/ \; 2>/dev/null || true
            ls .cache/personas | head -3
          fi
      - name: Render
        run: python -m engine.render "${{ matrix.spec }}" --out out
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py "${{ matrix.spec }}" out
